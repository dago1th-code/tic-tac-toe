<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="David Harris Tic Tac Toe - Clean, modern, green-branded React web game." />
  <title>David Harris Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- React 18, Babel & Canvas Confetti CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* Brand Green Palette */
      --color-primary-800: #166534;
      --color-primary-700: #15803d;
      --color-primary-600: #16a34a;
      --color-primary-500: #22c55e;
      --color-primary-400: #4ade80;
      --color-primary-200: #bbf7d0;
      --color-primary-100: #dcfce7;
      --color-primary-50: #f0fdf4;

      /* Neutral Palette */
      --color-neutral-900: #171717;
      --color-neutral-800: #262626;
      --color-neutral-700: #404040;
      --color-neutral-600: #525252;
      --color-neutral-400: #a3a3a3;
      --color-neutral-300: #d4d4d4;
      --color-neutral-200: #e5e5e5;
      --color-neutral-100: #f5f5f5;
      --color-white: #ffffff;

      /* Player Colors */
      --color-player-x: #15803d;
      --color-player-x-bg: #dcfce7;
      --color-player-o: #0284c7;
      --color-player-o-bg: #e0f2fe;

      /* Winning highlight */
      --color-win-bg: #86efac;
      --color-win-border: #16a34a;
      --color-win-text: #14532d;

      /* UI Tokens */
      --color-background: var(--color-primary-50);
      --color-surface: var(--color-white);
      --color-surface-hover: #f9fdfa;
      --color-text-main: var(--color-neutral-900);
      --color-text-muted: var(--color-neutral-600);
      --color-border: #e2e8f0;

      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(22, 163, 74, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 25px -5px rgba(22, 163, 74, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-cell: 0 3px 8px rgba(0, 0, 0, 0.04);

      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-md) var(--spacing-sm);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: var(--spacing-md);
      gap: var(--spacing-xs);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-sm);
      background-color: var(--color-primary-100);
      color: var(--color-primary-800);
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid var(--color-primary-200);
      box-shadow: 0 1px 2px rgba(22, 163, 74, 0.08);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-primary-600);
      animation: pulse 2s infinite ease-in-out;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-neutral-900);
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 0.9375rem;
      color: var(--color-neutral-600);
    }

    @media (min-width: 768px) {
      .title {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1rem;
      }
    }

    /* Main Card */
    .main-card {
      width: 100%;
      background-color: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--spacing-md);
      border: 1px solid var(--color-primary-100);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (min-width: 480px) {
      .main-card {
        padding: var(--spacing-lg) var(--spacing-xl);
      }
    }

    /* Status Banner */
    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: 10px 20px;
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-md);
      font-size: 1.125rem;
      font-weight: 700;
      min-height: 48px;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-sm);
      border: 1px solid transparent;
      width: 100%;
      max-width: 380px;
    }

    .status-turn-x {
      background-color: var(--color-primary-100);
      color: var(--color-primary-800);
      border-color: var(--color-primary-200);
    }

    .status-turn-o {
      background-color: var(--color-player-o-bg);
      color: var(--color-player-o);
      border-color: #bae6fd;
    }

    .status-win {
      background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700));
      color: var(--color-white);
      border-color: var(--color-primary-700);
      animation: bounceIn 0.5s var(--transition-bounce);
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }

    .status-draw {
      background-color: var(--color-neutral-100);
      color: var(--color-neutral-700);
      border-color: var(--color-neutral-300);
    }

    .player-mark-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.9375rem;
    }

    .badge-x {
      background-color: var(--color-primary-700);
      color: var(--color-white);
    }

    .badge-o {
      background-color: var(--color-player-o);
      color: var(--color-white);
    }

    /* Board */
    .board-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 0 auto var(--spacing-lg) auto;
      display: flex;
      justify-content: center;
    }

    .board-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--spacing-sm);
      background-color: var(--color-primary-100);
      padding: var(--spacing-sm);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-primary-200);
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 480px) {
      .board-grid {
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        border-radius: var(--radius-xl);
      }
    }

    /* Cell */
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-cell);
      transition: all var(--transition-normal);
      cursor: pointer;
      padding: 0;
      user-select: none;
    }

    .cell:hover:not(:disabled) {
      background-color: var(--color-primary-50);
      border-color: var(--color-primary-400);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .cell:active:not(:disabled) {
      transform: translateY(0);
      background-color: var(--color-primary-100);
    }

    .cell:focus-visible {
      outline: 3px solid var(--color-primary-600);
      outline-offset: 2px;
      z-index: 2;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell-x {
      color: var(--color-primary-700);
      background-color: #fafdfa;
    }

    .cell-o {
      color: var(--color-player-o);
      background-color: #fbfdff;
    }

    .cell-winning {
      background-color: var(--color-win-bg) !important;
      border-color: var(--color-win-border) !important;
      color: var(--color-win-text) !important;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4), var(--shadow-md);
      animation: winPulse 1.4s infinite alternate ease-in-out;
      z-index: 1;
    }

    .mark-icon {
      width: 60%;
      height: 60%;
      animation: popIn 0.2s var(--transition-bounce);
    }

    /* ScoreBoard */
    .score-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-sm);
      width: 100%;
      max-width: 380px;
      margin: 0 auto var(--spacing-lg) auto;
    }

    .score-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-normal);
    }

    .card-x {
      border-left: 4px solid var(--color-primary-600);
    }

    .card-draws {
      border-left: 4px solid var(--color-neutral-400);
    }

    .card-o {
      border-left: 4px solid var(--color-player-o);
    }

    .card-active {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      background-color: var(--color-surface-hover);
      border-color: var(--color-primary-400);
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .player-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-neutral-600);
    }

    .active-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-primary-600);
      animation: pulse 1.5s infinite;
    }

    .score-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-neutral-900);
      line-height: 1;
    }

    @media (min-width: 480px) {
      .score-container {
        gap: var(--spacing-md);
      }
      .score-card {
        padding: 12px 12px;
      }
      .player-label {
        font-size: 0.8125rem;
      }
      .score-value {
        font-size: 1.75rem;
      }
    }

    /* Buttons */
    .action-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-md);
      width: 100%;
      max-width: 380px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      font-weight: 600;
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      cursor: pointer;
      padding: 10px 18px;
      font-size: 0.9375rem;
      font-family: inherit;
      border: none;
      user-select: none;
    }

    .btn:focus-visible {
      outline: 3px solid var(--color-primary-500);
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: var(--color-primary-600);
      color: var(--color-white);
      border: 1px solid var(--color-primary-700);
      box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-700);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(22, 163, 74, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
      background-color: var(--color-primary-800);
    }

    .btn-outline {
      background-color: var(--color-surface);
      color: var(--color-neutral-700);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .btn-outline:hover {
      background-color: var(--color-primary-50);
      color: var(--color-primary-800);
      border-color: var(--color-primary-300);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .footer {
      margin-top: var(--spacing-lg);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-neutral-600);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(1.3);
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      70% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes winPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
      }
      100% {
        transform: scale(1.04);
        box-shadow: 0 0 22px rgba(34, 197, 94, 0.6);
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.9);
        opacity: 0;
      }
      60% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // --- GAME ENGINE LOGIC ---
    const WINNING_COMBINATIONS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    function checkWinner(board) {
      for (const [a, b, c] of WINNING_COMBINATIONS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], winningCells: [a, b, c] };
        }
      }
      return null;
    }

    function checkDraw(board, winner) {
      if (winner) return false;
      return board.every(cell => cell !== null);
    }

    // --- COMPONENTS ---
    const Header = () => (
      <header className="header">
        <div className="brand-badge">
          <span className="brand-dot" aria-hidden="true"></span>
          <span>David Harris</span>
        </div>
        <h1 className="title">Tic Tac Toe</h1>
        <p className="subtitle">Classic strategy game with a modern green touch</p>
      </header>
    );

    const GameStatus = ({ currentPlayer, winner, isDraw }) => {
      let statusClass = "status-container";
      let content = null;

      if (winner) {
        statusClass += " status-win";
        content = (
          <>
            <span style={{ fontSize: '1.25rem' }}>🏆</span>
            <span>Player {winner} Wins!</span>
          </>
        );
      } else if (isDraw) {
        statusClass += " status-draw";
        content = (
          <>
            <span style={{ fontSize: '1.25rem' }}>🤝</span>
            <span>It's a Draw!</span>
          </>
        );
      } else {
        statusClass += currentPlayer === 'X' ? " status-turn-x" : " status-turn-o";
        content = (
          <>
            <span className={`player-mark-badge ${currentPlayer === 'X' ? 'badge-x' : 'badge-o'}`}>
              {currentPlayer}
            </span>
            <span>Player {currentPlayer}'s Turn</span>
          </>
        );
      }

      return (
        <div className={statusClass} role="status" aria-live="polite">
          {content}
        </div>
      );
    };

    const Cell = ({ value, index, isWinning, disabled, onClick }) => {
      const row = Math.floor(index / 3) + 1;
      const col = (index % 3) + 1;
      const desc = value ? `Player ${value}` : 'empty';

      let cellClass = "cell";
      if (value === 'X') cellClass += " cell-x";
      if (value === 'O') cellClass += " cell-o";
      if (isWinning) cellClass += " cell-winning";

      return (
        <button
          type="button"
          className={cellClass}
          onClick={onClick}
          disabled={disabled || value !== null}
          aria-label={`Row ${row}, Column ${col}, ${desc}`}
        >
          {value === 'X' && (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="mark-icon">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          )}
          {value === 'O' && (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="mark-icon">
              <circle cx="12" cy="12" r="8" />
            </svg>
          )}
        </button>
      );
    };

    const Board = ({ board, winningCells, isGameOver, onCellClick }) => (
      <div className="board-wrapper">
        <div className="board-grid" role="grid" aria-label="Tic Tac Toe 3 by 3 game board">
          {board.map((cell, idx) => (
            <Cell
              key={idx}
              index={idx}
              value={cell}
              isWinning={winningCells.includes(idx)}
              disabled={isGameOver}
              onClick={() => onCellClick(idx)}
            />
          ))}
        </div>
      </div>
    );

    const ScoreBoard = ({ scores, currentPlayer, isGameOver }) => {
      const isXActive = !isGameOver && currentPlayer === 'X';
      const isOActive = !isGameOver && currentPlayer === 'O';

      return (
        <section className="score-container" aria-label="Game Scoreboard">
          <div className={`score-card card-x ${isXActive ? 'card-active' : ''}`}>
            <div className="player-header">
              <span className="player-label">Player X</span>
              {isXActive && <span className="active-dot"></span>}
            </div>
            <span className="score-value">{scores.X}</span>
          </div>

          <div className="score-card card-draws">
            <div className="player-header">
              <span className="player-label">Draws</span>
            </div>
            <span className="score-value">{scores.draws}</span>
          </div>

          <div className={`score-card card-o ${isOActive ? 'card-active' : ''}`}>
            <div className="player-header">
              <span className="player-label">Player O</span>
              {isOActive && <span className="active-dot"></span>}
            </div>
            <span className="score-value">{scores.O}</span>
          </div>
        </section>
      );
    };

    // --- MAIN APP ---
    function App() {
      const [board, setBoard] = useState(Array(9).fill(null));
      const [currentPlayer, setCurrentPlayer] = useState('X');
      const [winner, setWinner] = useState(null);
      const [winningCells, setWinningCells] = useState([]);
      const [isDraw, setIsDraw] = useState(false);
      const [scores, setScores] = useState({ X: 0, O: 0, draws: 0 });

      const isGameOver = winner !== null || isDraw;

      useEffect(() => {
        if (winner && window.confetti) {
          window.confetti({
            particleCount: 75,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#16a34a', '#22c55e', '#4ade80', '#86efac', '#15803d']
          });
        }
      }, [winner]);

      const handleCellClick = (index) => {
        if (board[index] !== null || isGameOver) return;

        const newBoard = [...board];
        newBoard[index] = currentPlayer;

        const winResult = checkWinner(newBoard);
        const drawResult = checkDraw(newBoard, winResult ? winResult.winner : null);

        setBoard(newBoard);

        if (winResult) {
          setWinner(winResult.winner);
          setWinningCells(winResult.winningCells);
          setScores(prev => ({ ...prev, [winResult.winner]: prev[winResult.winner] + 1 }));
        } else if (drawResult) {
          setIsDraw(true);
          setScores(prev => ({ ...prev, draws: prev.draws + 1 }));
        } else {
          setCurrentPlayer(prev => (prev === 'X' ? 'O' : 'X'));
        }
      };

      const startNewGame = () => {
        setBoard(Array(9).fill(null));
        setCurrentPlayer('X');
        setWinner(null);
        setWinningCells([]);
        setIsDraw(false);
      };

      const resetScores = () => {
        setScores({ X: 0, O: 0, draws: 0 });
      };

      return (
        <div className="app-container">
          <Header />
          <main className="main-card">
            <GameStatus currentPlayer={currentPlayer} winner={winner} isDraw={isDraw} />
            <Board board={board} winningCells={winningCells} isGameOver={isGameOver} onCellClick={handleCellClick} />
            <ScoreBoard scores={scores} currentPlayer={currentPlayer} isGameOver={isGameOver} />
            <div className="action-controls">
              <button type="button" className="btn btn-primary" onClick={startNewGame}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                  <path d="M21 3v5h-5" />
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                  <path d="M8 16H3v5" />
                </svg>
                New Game
              </button>
              <button type="button" className="btn btn-outline" onClick={resetScores}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 6h18" />
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                </svg>
                Reset Scores
              </button>
            </div>
          </main>
          <footer className="footer">
            <p>© 2026 David Harris • Crafted with React & Green Identity</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
