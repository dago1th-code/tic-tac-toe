<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="DAGO Tic Tac Toe - Clean, modern, gradient blue-purple React web game with AI, history, light/dark mode and sound effects." />
  <title>DAGO Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- React 18, Babel & Canvas Confetti CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* Brand Blue-Purple Palette */
      --color-primary-900: #312e81;
      --color-primary-800: #3730a3;
      --color-primary-700: #4338ca;
      --color-primary-600: #4f46e5;
      --color-primary-500: #6366f1;
      --color-primary-400: #818cf8;
      --color-primary-300: #a5b4fc;
      --color-primary-200: #c7d2fe;
      --color-primary-100: #e0e7ff;
      --color-primary-50: #eef2ff;

      --color-purple-800: #6b21a8;
      --color-purple-700: #7e22ce;
      --color-purple-600: #9333ea;
      --color-purple-500: #a855f7;
      --color-purple-400: #c084fc;
      --color-purple-200: #e9d5ff;
      --color-purple-100: #f3e8ff;
      --color-purple-50: #faf5ff;

      --gradient-brand: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #c026d3 100%);
      --gradient-brand-hover: linear-gradient(135deg, #1d4ed8 0%, #6d28d9 50%, #a21caf 100%);
      --gradient-badge: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.2) 100%);
      --gradient-x: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --gradient-o: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);

      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;

      /* Radii */
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* DARK THEME (Default) */
    :root, [data-theme='dark'] {
      --theme-bg-base: #0b0f19;
      --theme-bg-gradient: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
        radial-gradient(at 85% 80%, rgba(192, 38, 211, 0.20) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(37, 99, 235, 0.15) 0px, transparent 65%),
        linear-gradient(180deg, #0b0f19 0%, #111827 100%);

      --color-surface: rgba(17, 24, 39, 0.92);
      --color-surface-hover: #1e293b;
      --color-surface-subtle: #1e293b;
      --color-card-border: rgba(139, 92, 246, 0.25);
      --color-card-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;

      --color-cell-bg: #1e293b;
      --color-cell-hover: rgba(99, 102, 241, 0.2);
      --color-cell-border: #334155;
      --color-board-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
      --color-board-border: rgba(139, 92, 246, 0.35);

      --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-border: #334155;

      --color-player-x: #60a5fa;
      --color-player-x-bg: rgba(37, 99, 235, 0.2);
      --color-player-o: #c084fc;
      --color-player-o-bg: rgba(147, 51, 234, 0.2);

      --color-win-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.35) 0%, rgba(192, 38, 211, 0.35) 100%);
      --color-win-border: #a855f7;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-cell: 0 3px 8px rgba(0, 0, 0, 0.3);
      --shadow-glow-win: 0 0 24px rgba(168, 85, 247, 0.5);
    }

    /* LIGHT THEME */
    [data-theme='light'] {
      --theme-bg-base: #f8faff;
      --theme-bg-gradient: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 80%, rgba(192, 38, 211, 0.10) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(37, 99, 235, 0.08) 0px, transparent 65%),
        linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);

      --color-surface: rgba(255, 255, 255, 0.96);
      --color-surface-hover: #f8faff;
      --color-surface-subtle: #f1f5f9;
      --color-card-border: rgba(139, 92, 246, 0.18);
      --color-card-shadow: 0 20px 45px -10px rgba(79, 70, 229, 0.16), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;

      --color-cell-bg: #ffffff;
      --color-cell-hover: rgba(99, 102, 241, 0.08);
      --color-cell-border: #e2e8f0;
      --color-board-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.12) 100%);
      --color-board-border: rgba(139, 92, 246, 0.25);

      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;

      --color-player-x: #2563eb;
      --color-player-x-bg: #eff6ff;
      --color-player-o: #9333ea;
      --color-player-o-bg: #faf5ff;

      --color-win-bg: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      --color-win-border: #7c3aed;

      --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
      --shadow-cell: 0 3px 8px rgba(0, 0, 0, 0.04);
      --shadow-glow-win: 0 0 24px rgba(124, 58, 237, 0.4);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--theme-bg-base);
      background-image: var(--theme-bg-gradient);
      background-attachment: fixed;
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-md) var(--spacing-sm);
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    .app-container {
      width: 100%;
      max-width: 490px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: var(--spacing-md);
      gap: var(--spacing-xs);
      width: 100%;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-sm);
      background: var(--gradient-badge);
      color: var(--color-primary-300);
      padding: 4px 16px;
      border-radius: var(--radius-full);
      font-size: 0.8125rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(139, 92, 246, 0.35);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
      backdrop-filter: blur(8px);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
      box-shadow: 0 0 8px #818cf8;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.8; }
    }

    .brand-name {
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #93c5fd 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      color: var(--color-text-main);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
      border-color: var(--color-primary-400);
    }

    .title {
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    /* Main Card */
    .main-card {
      width: 100%;
      background: var(--color-surface);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      padding: var(--spacing-md);
      border: 1px solid var(--color-card-border);
      box-shadow: var(--color-card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    @media (min-width: 480px) {
      .main-card {
        padding: var(--spacing-lg) var(--spacing-xl);
      }
    }

    /* Mode Selector */
    .mode-container {
      width: 100%;
      margin-bottom: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .mode-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-sm);
      width: 100%;
    }

    .mode-tabs {
      display: flex;
      background-color: var(--color-surface-subtle);
      padding: 4px;
      border-radius: var(--radius-lg);
      gap: 4px;
      flex: 1;
      border: 1px solid var(--color-border);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tab-btn:hover { color: var(--color-text-main); }

    .tab-active {
      background: var(--color-surface);
      color: var(--color-primary-400);
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.2);
      font-weight: 700;
    }

    .sound-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .sound-on {
      color: var(--color-primary-400);
      background-color: var(--color-surface-subtle);
      border-color: var(--color-primary-400);
    }

    .sound-off {
      color: var(--color-text-muted);
      background-color: var(--color-surface-subtle);
    }

    .difficulty-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.12) 100%);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .diff-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-primary-400);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }

    .diff-btn {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .diff-active {
      background-color: var(--color-surface);
      color: var(--color-purple-400);
      border-color: var(--color-purple-400);
      box-shadow: 0 2px 4px rgba(124, 58, 237, 0.2);
      font-weight: 700;
    }

    /* Status Banner */
    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: 12px 22px;
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-md);
      font-size: 1.125rem;
      font-weight: 700;
      min-height: 52px;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-sm);
      border: 1px solid transparent;
      width: 100%;
      max-width: 380px;
    }

    .status-turn-x {
      background-color: var(--color-player-x-bg);
      color: var(--color-player-x);
      border-color: rgba(37, 99, 235, 0.3);
    }

    .status-turn-o {
      background-color: var(--color-player-o-bg);
      color: var(--color-player-o);
      border-color: rgba(147, 51, 234, 0.3);
    }

    .status-win {
      background: var(--gradient-brand);
      color: #ffffff;
      animation: bounceIn 0.5s var(--transition-bounce);
      box-shadow: var(--shadow-glow-win);
    }

    .status-draw {
      background-color: var(--color-surface-subtle);
      color: var(--color-text-muted);
      border-color: var(--color-border);
    }

    .player-mark-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.9375rem;
    }

    .badge-x {
      background: var(--gradient-x);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    .badge-o {
      background: var(--gradient-o);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
    }

    /* Board & Cells */
    .board-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 0 auto var(--spacing-lg) auto;
      display: flex;
      justify-content: center;
    }

    .board-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--spacing-sm);
      background: var(--color-board-bg);
      padding: var(--spacing-sm);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-board-border);
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.15);
    }

    @media (min-width: 480px) {
      .board-grid {
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        border-radius: var(--radius-xl);
      }
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--color-cell-bg);
      border: 2px solid var(--color-cell-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-cell);
      transition: all var(--transition-normal);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
    }

    .cell:hover:not(:disabled) {
      background-color: var(--color-cell-hover);
      border-color: var(--color-primary-400);
      transform: translateY(-2px);
    }

    .cell:disabled { cursor: default; }

    .cell-x { color: var(--color-player-x); }
    .cell-o { color: var(--color-player-o); }

    .cell-winning {
      background: var(--color-win-bg) !important;
      border-color: var(--color-win-border) !important;
      box-shadow: var(--shadow-glow-win), var(--shadow-sm);
      animation: winPulse 1.4s infinite alternate ease-in-out;
      z-index: 1;
    }

    .mark-icon {
      width: 60%;
      height: 60%;
      stroke: currentColor;
      animation: popIn 0.22s var(--transition-bounce);
    }

    .cell-x .mark-icon {
      filter: drop-shadow(0 2px 8px rgba(37, 99, 235, 0.45));
    }

    .cell-o .mark-icon {
      filter: drop-shadow(0 2px 8px rgba(147, 51, 234, 0.45));
    }

    /* Scoreboard */
    .score-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-sm);
      width: 100%;
      max-width: 380px;
      margin: 0 auto var(--spacing-lg) auto;
    }

    .score-card {
      background-color: var(--color-surface-subtle);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-normal);
      position: relative;
    }

    .card-x { border-top: 3px solid var(--color-player-x); }
    .card-draws { border-top: 3px solid var(--color-text-muted); }
    .card-o { border-top: 3px solid var(--color-player-o); }

    .card-active {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.22);
      background-color: var(--color-surface-hover);
      border-color: var(--color-primary-400);
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .player-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }

    .active-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gradient-brand);
      animation: pulseDot 1.5s infinite;
    }

    .score-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-text-main);
      line-height: 1;
    }

    /* Actions */
    .action-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-md);
      width: 100%;
      max-width: 380px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      font-weight: 600;
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      cursor: pointer;
      white-space: nowrap;
      padding: 10px 18px;
      font-size: 0.9375rem;
      border: none;
    }

    .btn-primary {
      background: var(--gradient-brand);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      background: var(--gradient-brand-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }

    .btn-outline {
      background-color: var(--color-surface);
      color: var(--color-text-main);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .btn-outline:hover {
      background-color: var(--color-surface-hover);
      border-color: var(--color-primary-400);
      transform: translateY(-1px);
    }

    /* Match History Section */
    .history-section {
      width: 100%;
      max-width: 380px;
      margin-top: var(--spacing-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background-color: var(--color-surface-subtle);
      overflow: hidden;
    }

    .history-toggle-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: transparent;
      color: var(--color-text-main);
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .history-drawer {
      padding: 12px 14px;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: var(--color-surface);
      padding: 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      text-align: center;
    }

    .stat-label {
      font-size: 0.6875rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-num {
      font-size: 1rem;
      font-weight: 800;
      color: var(--color-text-main);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    .clear-history-btn {
      align-self: flex-end;
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-xs);
    }

    .clear-history-btn:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    .footer {
      margin-top: var(--spacing-lg);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes winPulse {
      0% { transform: scale(1); box-shadow: 0 0 12px rgba(124, 58, 237, 0.35); }
      100% { transform: scale(1.04); box-shadow: 0 0 24px rgba(124, 58, 237, 0.7); }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // --- SOUND ENGINE ---
    class SoundEngine {
      constructor() { this.ctx = null; }
      getContext() {
        if (typeof window === 'undefined') return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      playMove(player) {
        const ctx = this.getContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const freq = player === 'X' ? 440 : 554.37;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.3, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
      }
      playWin() {
        const ctx = this.getContext();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const t = ctx.currentTime + i * 0.1;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.4);
        });
      }
      playDraw() {
        const ctx = this.getContext();
        if (!ctx) return;
        [440, 392, 349.23].forEach((freq, i) => {
          const t = ctx.currentTime + i * 0.12;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.3);
        });
      }
      playReset() {
        const ctx = this.getContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.13);
      }
    }
    const soundEngine = new SoundEngine();

    // --- GAME ENGINE & AI LOGIC ---
    const WINNING_COMBINATIONS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function checkWinner(board) {
      for (const [a, b, c] of WINNING_COMBINATIONS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], winningCells: [a, b, c] };
        }
      }
      return null;
    }

    function checkDraw(board, winner) {
      if (winner) return false;
      return board.every(cell => cell !== null);
    }

    function getAvailableMoves(board) {
      const moves = [];
      for (let i = 0; i < board.length; i++) {
        if (board[i] === null) moves.push(i);
      }
      return moves;
    }

    function minimax(board, depth, isMaximizing, aiPlayer, humanPlayer) {
      const win = checkWinner(board);
      if (win) {
        return { score: win.winner === aiPlayer ? 10 - depth : depth - 10 };
      }
      if (checkDraw(board, null)) return { score: 0 };

      const available = getAvailableMoves(board);
      if (isMaximizing) {
        let maxScore = -Infinity;
        let bestMove = available[0];
        for (const move of available) {
          board[move] = aiPlayer;
          const evaluation = minimax(board, depth + 1, false, aiPlayer, humanPlayer);
          board[move] = null;
          if (evaluation.score > maxScore) {
            maxScore = evaluation.score;
            bestMove = move;
          }
        }
        return { score: maxScore, bestMove };
      } else {
        let minScore = Infinity;
        let bestMove = available[0];
        for (const move of available) {
          board[move] = humanPlayer;
          const evaluation = minimax(board, depth + 1, true, aiPlayer, humanPlayer);
          board[move] = null;
          if (evaluation.score < minScore) {
            minScore = evaluation.score;
            bestMove = move;
          }
        }
        return { score: minScore, bestMove };
      }
    }

    function getAIMove(board, aiPlayer = 'O', difficulty = 'hard') {
      const available = getAvailableMoves(board);
      if (available.length === 0) return -1;
      const humanPlayer = aiPlayer === 'X' ? 'O' : 'X';

      if (difficulty === 'easy') {
        return available[Math.floor(Math.random() * available.length)];
      }

      if (difficulty === 'medium') {
        for (const move of available) {
          board[move] = aiPlayer;
          if (checkWinner(board)?.winner === aiPlayer) {
            board[move] = null;
            return move;
          }
          board[move] = null;
        }
        for (const move of available) {
          board[move] = humanPlayer;
          if (checkWinner(board)?.winner === humanPlayer) {
            board[move] = null;
            return move;
          }
          board[move] = null;
        }
        if (board[4] === null && Math.random() > 0.3) return 4;
        return available[Math.floor(Math.random() * available.length)];
      }

      const res = minimax(board, 0, true, aiPlayer, humanPlayer);
      return res.bestMove !== undefined ? res.bestMove : available[0];
    }

    // --- COMPONENTS ---
    const Header = ({ theme, onToggleTheme }) => (
      <header className="header">
        <div className="header-top-row">
          <div className="brand-badge">
            <span className="brand-dot" aria-hidden="true"></span>
            <span className="brand-name">DAGO</span>
          </div>
          <button
            type="button"
            className="theme-toggle-btn"
            onClick={onToggleTheme}
            title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
          >
            {theme === 'dark' ? '☀️' : '🌙'}
          </button>
        </div>
        <h1 className="title">
          <span className="gradient-text">TIC TAC TOE</span>
        </h1>
        <p className="subtitle">Modern strategy game with dynamic AI & sound effects</p>
      </header>
    );

    const ModeSelector = ({ gameMode, aiDifficulty, soundEnabled, onSelectMode, onSelectDifficulty, onToggleSound }) => (
      <div className="mode-container">
        <div className="mode-top-row">
          <div className="mode-tabs" role="tablist">
            <button
              type="button"
              role="tab"
              className={`tab-btn ${gameMode === 'pvp' ? 'tab-active' : ''}`}
              onClick={() => onSelectMode('pvp')}
            >
              <span>👥</span>
              <span>2 Players</span>
            </button>
            <button
              type="button"
              role="tab"
              className={`tab-btn ${gameMode === 'ai' ? 'tab-active' : ''}`}
              onClick={() => onSelectMode('ai')}
            >
              <span>🤖</span>
              <span>vs Computer</span>
            </button>
          </div>
          <button
            type="button"
            className={`sound-btn ${soundEnabled ? 'sound-on' : 'sound-off'}`}
            onClick={onToggleSound}
            title={soundEnabled ? 'Sound On' : 'Sound Off'}
          >
            {soundEnabled ? (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>
            ) : (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <line x1="23" y1="9" x2="17" y2="15" />
                <line x1="17" y1="9" x2="23" y2="15" />
              </svg>
            )}
          </button>
        </div>

        {gameMode === 'ai' && (
          <div className="difficulty-row">
            <span className="diff-label">AI Level:</span>
            {['easy', 'medium', 'hard'].map(diff => (
              <button
                key={diff}
                type="button"
                className={`diff-btn ${aiDifficulty === diff ? 'diff-active' : ''}`}
                onClick={() => onSelectDifficulty(diff)}
              >
                {diff === 'easy' && '🌱 Easy'}
                {diff === 'medium' && '⚡ Medium'}
                {diff === 'hard' && '🔥 Unbeatable'}
              </button>
            ))}
          </div>
        )}
      </div>
    );

    const GameStatus = ({ currentPlayer, winner, isDraw }) => {
      let statusClass = "status-container";
      let content = null;

      if (winner) {
        statusClass += " status-win";
        content = (
          <>
            <span style={{ fontSize: '1.25rem' }}>🏆</span>
            <span>Player {winner} Wins!</span>
          </>
        );
      } else if (isDraw) {
        statusClass += " status-draw";
        content = (
          <>
            <span style={{ fontSize: '1.25rem' }}>🤝</span>
            <span>It's a Draw!</span>
          </>
        );
      } else {
        statusClass += currentPlayer === 'X' ? " status-turn-x" : " status-turn-o";
        content = (
          <>
            <span className={`player-mark-badge ${currentPlayer === 'X' ? 'badge-x' : 'badge-o'}`}>
              {currentPlayer}
            </span>
            <span>Player {currentPlayer}'s Turn</span>
          </>
        );
      }

      return (
        <div className={statusClass} role="status" aria-live="polite">
          {content}
        </div>
      );
    };

    const Cell = ({ value, index, isWinning, disabled, onClick }) => {
      const row = Math.floor(index / 3) + 1;
      const col = (index % 3) + 1;
      const desc = value ? `Player ${value}` : 'empty';

      let cellClass = "cell";
      if (value === 'X') cellClass += " cell-x";
      if (value === 'O') cellClass += " cell-o";
      if (isWinning) cellClass += " cell-winning";

      return (
        <button
          type="button"
          className={cellClass}
          onClick={onClick}
          disabled={disabled || value !== null}
          aria-label={`Row ${row}, Column ${col}, ${desc}`}
        >
          {value === 'X' && (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="mark-icon">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          )}
          {value === 'O' && (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="mark-icon">
              <circle cx="12" cy="12" r="8" />
            </svg>
          )}
        </button>
      );
    };

    const Board = ({ board, winningCells, isGameOver, onCellClick }) => (
      <div className="board-wrapper">
        <div className="board-grid" role="grid" aria-label="Tic Tac Toe 3 by 3 game board">
          {board.map((cell, idx) => (
            <Cell
              key={idx}
              index={idx}
              value={cell}
              isWinning={winningCells.includes(idx)}
              disabled={isGameOver}
              onClick={() => onCellClick(idx)}
            />
          ))}
        </div>
      </div>
    );

    const ScoreBoard = ({ scores, currentPlayer, isGameOver }) => {
      const isXActive = !isGameOver && currentPlayer === 'X';
      const isOActive = !isGameOver && currentPlayer === 'O';

      return (
        <section className="score-container" aria-label="Game Scoreboard">
          <div className={`score-card card-x ${isXActive ? 'card-active' : ''}`}>
            <div className="player-header">
              <span className="player-label">Player X</span>
              {isXActive && <span className="active-dot"></span>}
            </div>
            <span className="score-value">{scores.X}</span>
          </div>

          <div className="score-card card-draws">
            <div className="player-header">
              <span className="player-label">Draws</span>
            </div>
            <span className="score-value">{scores.draws}</span>
          </div>

          <div className={`score-card card-o ${isOActive ? 'card-active' : ''}`}>
            <div className="player-header">
              <span className="player-label">Player O</span>
              {isOActive && <span className="active-dot"></span>}
            </div>
            <span className="score-value">{scores.O}</span>
          </div>
        </section>
      );
    };

    const GameHistory = ({ history, onClearHistory }) => {
      const [isOpen, setIsOpen] = useState(false);
      const total = history.length;
      const xWins = history.filter(h => h.winner === 'X').length;
      const oWins = history.filter(h => h.winner === 'O').length;
      const draws = history.filter(h => h.winner === 'Draw').length;

      return (
        <section className="history-section" aria-label="Match History">
          <button
            type="button"
            className="history-toggle-btn"
            onClick={() => setIsOpen(!isOpen)}
          >
            <span>📜 Match History ({total})</span>
            <span>{isOpen ? '▲' : '▼'}</span>
          </button>

          {isOpen && (
            <div className="history-drawer">
              {total > 0 ? (
                <>
                  <div className="stats-grid">
                    <div>
                      <div className="stat-label">X Wins</div>
                      <div className="stat-num" style={{ color: 'var(--color-player-x)' }}>{xWins}</div>
                    </div>
                    <div>
                      <div className="stat-label">O Wins</div>
                      <div className="stat-num" style={{ color: 'var(--color-player-o)' }}>{oWins}</div>
                    </div>
                    <div>
                      <div className="stat-label">Draws</div>
                      <div className="stat-num">{draws}</div>
                    </div>
                  </div>

                  <div className="history-list">
                    {history.map((item, idx) => (
                      <div key={item.id || idx} className="history-item">
                        <div>
                          <strong style={{ fontSize: '0.8125rem' }}>Round #{item.roundNumber}</strong>: {' '}
                          <span style={{ color: item.winner === 'X' ? 'var(--color-player-x)' : item.winner === 'O' ? 'var(--color-player-o)' : 'var(--color-text-muted)' }}>
                            {item.winner === 'Draw' ? '🤝 Draw' : `🏆 Player ${item.winner} Won`}
                          </span>
                        </div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--color-text-muted)' }}>
                          {item.totalMoves} moves • {item.gameMode === 'ai' ? '🤖 AI' : '👥 2P'}
                        </div>
                      </div>
                    ))}
                  </div>

                  <button type="button" className="clear-history-btn" onClick={onClearHistory}>
                    🗑️ Clear History
                  </button>
                </>
              ) : (
                <div style={{ textAlign: 'center', padding: '12px', fontSize: '0.8125rem', color: 'var(--color-text-muted)' }}>
                  No match history yet. Complete a round to track results!
                </div>
              )}
            </div>
          )}
        </section>
      );
    };

    // --- MAIN APP ---
    function App() {
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('dago_theme') || 'dark';
      });

      const [board, setBoard] = useState(Array(9).fill(null));
      const [currentPlayer, setCurrentPlayer] = useState('X');
      const [winner, setWinner] = useState(null);
      const [winningCells, setWinningCells] = useState([]);
      const [isDraw, setIsDraw] = useState(false);
      const [scores, setScores] = useState({ X: 0, O: 0, draws: 0 });
      const [history, setHistory] = useState([]);
      const [gameMode, setGameMode] = useState('pvp');
      const [aiDifficulty, setAIDifficulty] = useState('medium');
      const [soundEnabled, setSoundEnabled] = useState(true);

      const isGameOver = winner !== null || isDraw;
      const isAIMovingRef = useRef(false);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('dago_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      useEffect(() => {
        if (winner) {
          if (soundEnabled) soundEngine.playWin();
          if (window.confetti) {
            window.confetti({
              particleCount: 85,
              spread: 75,
              origin: { y: 0.6 },
              colors: ['#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#38bdf8']
            });
          }
        } else if (isDraw && soundEnabled) {
          soundEngine.playDraw();
        }
      }, [winner, isDraw, soundEnabled]);

      // AI auto-move
      useEffect(() => {
        if (gameMode === 'ai' && currentPlayer === 'O' && !isGameOver && !isAIMovingRef.current) {
          isAIMovingRef.current = true;
          const timer = setTimeout(() => {
            const aiMove = getAIMove([...board], 'O', aiDifficulty);
            if (aiMove !== -1) {
              if (soundEnabled) soundEngine.playMove('O');
              applyMoveToBoard(aiMove, 'O');
            }
            isAIMovingRef.current = false;
          }, 450);
          return () => {
            clearTimeout(timer);
            isAIMovingRef.current = false;
          };
        }
      }, [gameMode, currentPlayer, isGameOver, board, aiDifficulty, soundEnabled]);

      const applyMoveToBoard = (index, player) => {
        setBoard(prevBoard => {
          const newBoard = [...prevBoard];
          newBoard[index] = player;

          const winResult = checkWinner(newBoard);
          const drawResult = checkDraw(newBoard, winResult ? winResult.winner : null);

          if (winResult) {
            setWinner(winResult.winner);
            setWinningCells(winResult.winningCells);
            setScores(prev => ({ ...prev, [winResult.winner]: prev[winResult.winner] + 1 }));
            setHistory(prev => [
              {
                id: String(Date.now()),
                roundNumber: prev.length + 1,
                winner: winResult.winner,
                totalMoves: newBoard.filter(Boolean).length,
                timestamp: Date.now(),
                gameMode,
              },
              ...prev
            ]);
          } else if (drawResult) {
            setIsDraw(true);
            setScores(prev => ({ ...prev, draws: prev.draws + 1 }));
            setHistory(prev => [
              {
                id: String(Date.now()),
                roundNumber: prev.length + 1,
                winner: 'Draw',
                totalMoves: 9,
                timestamp: Date.now(),
                gameMode,
              },
              ...prev
            ]);
          } else {
            setCurrentPlayer(player === 'X' ? 'O' : 'X');
          }

          return newBoard;
        });
      };

      const handleCellClick = (index) => {
        if (gameMode === 'ai' && currentPlayer === 'O') return;
        if (board[index] !== null || isGameOver) return;

        if (soundEnabled) soundEngine.playMove(currentPlayer);
        applyMoveToBoard(index, currentPlayer);
      };

      const startNewGame = () => {
        if (soundEnabled) soundEngine.playReset();
        setBoard(Array(9).fill(null));
        setCurrentPlayer('X');
        setWinner(null);
        setWinningCells([]);
        setIsDraw(false);
      };

      const resetScores = () => {
        if (soundEnabled) soundEngine.playReset();
        setScores({ X: 0, O: 0, draws: 0 });
      };

      const clearHistory = () => {
        if (soundEnabled) soundEngine.playReset();
        setHistory([]);
      };

      return (
        <div className="app-container">
          <Header theme={theme} onToggleTheme={toggleTheme} />
          <main className="main-card">
            <ModeSelector
              gameMode={gameMode}
              aiDifficulty={aiDifficulty}
              soundEnabled={soundEnabled}
              onSelectMode={(mode) => {
                startNewGame();
                setGameMode(mode);
              }}
              onSelectDifficulty={setAIDifficulty}
              onToggleSound={() => setSoundEnabled(prev => !prev)}
            />
            <GameStatus currentPlayer={currentPlayer} winner={winner} isDraw={isDraw} />
            <Board board={board} winningCells={winningCells} isGameOver={isGameOver} onCellClick={handleCellClick} />
            <ScoreBoard scores={scores} currentPlayer={currentPlayer} isGameOver={isGameOver} />
            <div className="action-controls">
              <button type="button" className="btn btn-primary" onClick={startNewGame}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                  <path d="M21 3v5h-5" />
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                  <path d="M8 16H3v5" />
                </svg>
                New Game
              </button>
              <button type="button" className="btn btn-outline" onClick={resetScores}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 6h18" />
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                </svg>
                Reset Scores
              </button>
            </div>

            <GameHistory history={history} onClearHistory={clearHistory} />
          </main>
          <footer className="footer">
            <p>© 2026 DAGO • Crafted with React & Gradient Blue-Purple Identity</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
